name: Generate Compile Commands

on:
  workflow_dispatch:
    inputs:
      idf_ver:
        description: "IDF Version"
        default: "release-v5.3"
        type: choice
        options:
          - "release-v5.3"
          - "release-v5.4"
          - "release-v5.5"
        required: true
      idf_target:
        description: "IDF Target"
        default: "esp32"
        type: choice
        options:
          - "esp32"
          - "esp32s2"
          - "esp32s3"
          - "esp32c2"
          - "esp32c3"
          - "esp32c5"
          - "esp32c6"
          - "esp32h2"
          - "esp32p4"
        required: true
      examples:
        description: "Examples to build (comma-separated, or 'all')"
        default: "all"
        type: string
        required: true
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-generate-compile-commands:
    name: Build IDF ${{ inputs.idf_ver || 'release-v5.3' }} for ${{ inputs.idf_target || 'esp32' }}
    runs-on: ubuntu-latest
    container: espressif/idf:${{ inputs.idf_ver || 'release-v5.3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: components/arduino-esp32

      - name: Setup jq
        uses: dcarbone/install-jq-action@v3.0.1

      - name: Export IDF environment
        shell: bash
        run: |
          . ${IDF_PATH}/export.sh
          echo "IDF environment exported"

      - name: Determine examples to build
        id: examples
        shell: bash
        run: |
          cd components/arduino-esp32
          
          if [ "${{ inputs.examples }}" == "all" ] || [ -z "${{ inputs.examples }}" ]; then
            # Build all examples
            examples=$(find idf_component_examples -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          else
            # Build specified examples
            examples=$(echo "${{ inputs.examples }}" | tr ',' '\n' | sort)
          fi
          
          echo "Examples to build:"
          echo "$examples"
          echo "$examples" > /tmp/examples_to_build.txt

      - name: Build examples and generate compile_commands.json
        env:
          IDF_TARGET: ${{ inputs.idf_target || 'esp32' }}
        shell: bash
        run: |
          set -e
          
          # Export IDF environment
          . ${IDF_PATH}/export.sh
          
          cd components/arduino-esp32
          
          # Create output directory for compile_commands.json files
          mkdir -p compile_commands_output
          
          # Define check_requirements function
          check_requirements() {
            local example_path=$1
            local target=$2
            
            # Check if ci.json exists and has requirements
            if [ -f "$example_path/ci.json" ]; then
              # Check if target is explicitly disabled
              is_target=$(jq -r --arg target "$target" '.targets[$target]' "$example_path/ci.json" 2>/dev/null || echo "null")
              if [[ "$is_target" == "false" ]]; then
                return 1  # Target disabled
              fi
              
              # Check requirements array
              requirements=$(jq -r '.requires[]?' "$example_path/ci.json" 2>/dev/null || echo "")
              if [ -n "$requirements" ]; then
                while IFS= read -r req; do
                  if [ -n "$req" ]; then
                    # Simple SOC capability check based on target
                    case "$req" in
                      *USB_SERIAL_JTAG*)
                        # ESP32 (classic) doesn't support USB Serial JTAG
                        if [[ "$target" == "esp32" ]]; then
                          echo "Requirement not met: $req (target: $target)"
                          return 1
                        fi
                        ;;
                      *USB_OTG*)
                        # Only S2, S3, P4 support USB OTG
                        if [[ "$target" != "esp32s2" && "$target" != "esp32s3" && "$target" != "esp32p4" ]]; then
                          echo "Requirement not met: $req (target: $target)"
                          return 1
                        fi
                        ;;
                    esac
                  fi
                done <<< "$requirements"
              fi
            fi
            
            return 0  # Requirements met
          }
          
          while IFS= read -r example; do
            example_path="$PWD/idf_component_examples/$example"
            
            if [ ! -d "$example_path" ]; then
              echo "Warning: Example $example does not exist, skipping..."
              continue
            fi
            
            # Check if example meets requirements for target
            if ! check_requirements "$example_path" "$IDF_TARGET"; then
              echo ""
              echo "⊘ Skipping $example for target $IDF_TARGET (requirements not met)"
              echo ""
              continue
            fi
            
            echo "====================================="
            echo "Building: $example"
            echo "Target: $IDF_TARGET"
            echo "====================================="
            
            # Set target (continue on error to try other examples)
            if ! idf.py --preview -C "$example_path" set-target "$IDF_TARGET"; then
              echo "✗ Failed to set target for $example"
              echo ""
              continue
            fi
            
            # Build the project (this generates compile_commands.json in build directory)
            if idf.py --preview -C "$example_path" -DEXTRA_COMPONENT_DIRS="$PWD" build; then
              # Copy compile_commands.json to output directory
              if [ -f "$example_path/build/compile_commands.json" ]; then
                cp "$example_path/build/compile_commands.json" "$PWD/compile_commands_output/${example}_compile_commands.json"
                echo "✓ Generated compile_commands.json for $example"
              else
                echo "✗ No compile_commands.json found for $example"
              fi
            else
              echo "✗ Build failed for $example (continuing with other examples)"
            fi
            
            echo ""
          done < /tmp/examples_to_build.txt
          
          # Create a merged compile_commands.json (combines all examples)
          if [ -n "$(ls -A compile_commands_output/*.json 2>/dev/null)" ]; then
            echo "Merging all compile_commands.json files..."
            jq -s 'add' compile_commands_output/*_compile_commands.json > compile_commands_output/compile_commands_merged.json
            echo "✓ Created merged compile_commands.json"
          fi

      - name: Upload compile_commands.json files
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-${{ inputs.idf_target || 'esp32' }}-${{ inputs.idf_ver || 'release-v5.3' }}
          path: |
            components/arduino-esp32/compile_commands_output/*.json
            components/arduino-esp32/idf_component_examples/**/build/compile_commands.json
          if-no-files-found: warn

      - name: Upload build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ inputs.idf_target || 'esp32' }}-${{ inputs.idf_ver || 'release-v5.3' }}
          path: |
            components/arduino-esp32/idf_component_examples/**/build/*.bin
            components/arduino-esp32/idf_component_examples/**/build/*.elf
            components/arduino-esp32/idf_component_examples/**/build/*.map
            components/arduino-esp32/idf_component_examples/**/build/sdkconfig
          if-no-files-found: warn

      - name: Summary
        shell: bash
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **IDF Version:** ${{ inputs.idf_ver || 'release-v5.3' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ${{ inputs.idf_target || 'esp32' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Examples:** ${{ inputs.examples || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cd components/arduino-esp32/compile_commands_output
          if [ -n "$(ls -A *.json 2>/dev/null)" ]; then
            echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for file in *.json; do
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              echo "- \`$file\` ($(numfmt --to=iec-i --suffix=B $size 2>/dev/null || echo $size bytes))" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ No compile_commands.json files were generated" >> $GITHUB_STEP_SUMMARY
          fi

      # Add this step BEFORE "Run Embold Scanner" in your workflow:
      - name: Prepare Compilation Database for Embold
        run: |
          echo "ls /__w/arduino-esp32/arduino-esp32"
          ls /__w/arduino-esp32/arduino-esp32
          echo "ls /__w/arduino-esp32/arduino-esp32/components/arduino-esp32/compile_commands_output"
          ls /__w/arduino-esp32/arduino-esp32/components/arduino-esp32/compile_commands_output
          cp components/arduino-esp32/compile_commands_output/compile_commands_merged.json \
          /__w/arduino-esp32/arduino-esp32/compile_commands.json
          cp components/arduino-esp32/compile_commands_output/compile_commands_merged.json \
          components/arduino-esp32/compile_commands_output/compile_commands.json
          echo "ls /__w/arduino-esp32/arduino-esp32" 
          ls /__w/arduino-esp32/arduino-esp32
          echo "ls /__w/arduino-esp32/arduino-esp32/components/arduino-esp32/compile_commands_output"
          ls /__w/arduino-esp32/arduino-esp32/components/arduino-esp32/compile_commands_output
       
      # # Step 1: Check out your repository code
      # - name: Checkout Repository
      #   uses: actions/checkout@v4
      #   with:
      #     # Fetch full history for accurate analysis
      #     fetch-depth: 0

      # Step 2: Set up Java (required for Embold scanner)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 5: Download and extract the Embold scanner
      - name: Download and Extract Scanner
        run: |
          echo "Downloading Embold CLI scanner..."
          curl ${{ vars.EMBOLD_SCANNER_URL }} -o browserstack-codequality-scanner-archive.tar.gz
          tar xvf browserstack-codequality-scanner-archive.tar.gz
      # Step 6: Download the repository configuration file
      - name: Download Repository Configuration
        run: |
          curl --silent --location --request GET "http://18.184.13.138:4432/api/v1/repositories/db79f70ff17e7104c5b650fee54967fc/scans/config/download" \
               --header "Authorization: Bearer ${{ secrets.EMBOLD_SCAN_TOKEN_CPP }}" \
               -o repository-configuration.json
      # Step 7: Run the Embold analysis scanner
      - name: Run Embold Scanner
        run: |
          echo "Starting Embold analysis..."
          ./browserstack-codequality-scanner/bin/embold-scanner analyse \
            -u http://18.184.13.138:4432/ \
            -t ${{ secrets.EMBOLD_SCAN_TOKEN_CPP }} \
            -r db79f70ff17e7104c5b650fee54967fc \
            -b . \
            -d ./embold-data \
            -c ./repository-configuration.json \
            -l ./embold-log \
            -sh ./embold-scanner-home -v
